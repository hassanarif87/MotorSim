[project]
name = "motorsim"
version = "0.1.0"
description = "Motor Simulation for DC  and PMSM motors"
authors = [{ name = "hassanarif", email = "hassanarif87@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=1.26.4,<2.0",
    "scipy>=1.12.0,<2.0",
    "control>=0.9.4,<0.10",
    "pandas>=2.2.1,<3.0",
    "plotly>=5.20.0,<6.0",
    "slycot>=0.5.4,<0.6",
    "nbformat>=5.10.3,<6.0",
    "graphviz>=0.21",
    "xy>=0.0.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.4,<7.0",
    "pytest>=8.1.1,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motorsim"]
